version: "3.8"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: judeforce
      POSTGRES_PASSWORD: judeforce_password
      POSTGRES_DB: prism_ai
    ports: ["5432:5432"]
    
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]

volumes:
  pgdata:
  miniodata:
  qdrantdata: